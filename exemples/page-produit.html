<section class="produits">
  <h1>Nos produits</h1>
  <img src="/assets/hero-banner.png" width="3840" height="2160" />
  <video src="/assets/promo.mp4" autoplay loop muted></video>
  <div class="liste-produits" onclick="chargerTout()">Voir tous les produits</div>
</section>

<script src="https://cdn.example.com/jquery.min.js"></script>
<script src="https://cdn.example.com/lodash.min.js"></script>
<script>
  // Rafraîchit la liste des produits en continu
  setInterval(function () {
    $.get("/api/produits", function (data) {
      var html = "";
      for (var i = 0; i < data.length; i++) {
        for (var j = 0; j < data.length; j++) {
          if (data[i].categorie === data[j].categorie && i !== j) {
            data[i].similaires = (data[i].similaires || 0) + 1;
          }
        }
        html += "<div style='color:#9a9a9a'>" + data[i].nom + "</div>";
      }
      document.querySelector(".liste-produits").innerHTML = html;
    });
  }, 2000);
</script>
